# 网络分流检测 · 网页版（独立 Worker，与主 Worker zsxq-resources-v3 完全隔离）
# 部署：npx wrangler deploy -c wrangler-netcheck.toml
name = "zsxq-netcheck"
main = "netcheck-worker.js"
compatibility_date = "2024-03-21"
no_bundle = true

rules = [
  { type = "ESModule", globs = ["netcheck-worker.js"] },
]

# Custom Domain：check.williamsays.uk 是唯一还在用的域名，托管检测页。
#
# claude-check / googlevideo-check 两个旧版诱饵探针域名已清理——旧探测
# 方式依赖"未命中规则 → 兜底走机场"这一前提，新版配置改成 MATCH → DIRECT
# （省流量）后该前提不再成立。现已改用真实第三方站点探测（claude.ai /
# api.ipify.org / ipinfo.io / bbc.com，见 netcheck-worker.js 头部注释），
# 不再需要任何自建探针域名。
#
# ⚠ 新增 Custom Domain 后边缘证书签发需要几分钟，期间 TLS 握手会被重置（SSL_ERROR_SYSCALL），耐心等
routes = [
  { pattern = "check.williamsays.uk", custom_domain = true },
]
